<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Page Not Found</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        @keyframes float {
            0% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-12px);
            }

            100% {
                transform: translateY(0px);
            }
        }

        .float {
            animation: float 3s ease-in-out infinite;
        }
    </style>

</head>

<body class="flex items-center justify-center h-screen bg-gradient-to-br from-blue-100 to-purple-200">

    <div class="text-center">

        <div class="text-7xl font-bold text-blue-600 float">404</div>

        <h2 class="text-2xl font-semibold mt-4">Oops! Page not found</h2>

        <p class="text-gray-600 mt-2">
            The page you are looking for doesn't exist or was moved.
        </p>

        <a href="/" class="mt-6 inline-block bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700 transition">
            Go Home
        </a>

    </div>

</body>

</html>

<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Server Error</title>
    <script src="https://cdn.tailwindcss.com"></script>


    <style>
        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-6px);
            }

            75% {
                transform: translateX(6px);
            }
        }

        .shake {
            animation: shake 0.8s infinite;
        }
    </style>


</head>

<body class="flex items-center justify-center h-screen bg-gradient-to-br from-red-100 to-orange-200">


    <div class="text-center">

        <div class="text-7xl font-bold text-red-600 shake">500</div>

        <h2 class="text-2xl font-semibold mt-4">Something went wrong</h2>

        <p class="text-gray-700 mt-2">
            Our server had a problem. We're working to fix it.
        </p>

        <a href="/" class="mt-6 inline-block bg-red-600 text-white px-6 py-2 rounded-lg hover:bg-red-700 transition">
            Try Again
        </a>

    </div>

</body>

</html>

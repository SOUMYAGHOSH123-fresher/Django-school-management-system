
<!DOCTYPE html>
<html>

<body style="font-family: Arial, sans-serif; line-height: 1.6; color: #333;">
    <div style="max-width: 600px; margin: auto; padding: 20px; border: 1px solid #ddd; border-radius: 10px;">
        <h2 style="color: #2c3e50;">New Quiz Available!</h2>
        <p>Hello Student,</p>
        <p>A new quiz has been posted for your class: <strong>{{ quiz_title }}</strong>.</p>

        <div style="background: #f9f9f9; padding: 15px; border-left: 5px solid #3498db; margin: 20px 0;">
            <p style="margin: 0;"><strong>Subject:</strong> {{ subject }}</p>
            <p style="margin: 0;"><strong>Teacher:</strong> {{ teacher_name }}</p>
            <p style="margin: 0;"><strong>Type:</strong> {{ quiz_type }}</p>
        </div>

        <a href="{{ invite_url }}"
            style="display: inline-block; padding: 12px 25px; background-color: #3498db; color: white; text-decoration: none; border-radius: 5px;">
            Attempt Quiz Now
        </a>

        <p style="margin-top: 30px; font-size: 0.8em; color: #777;">
            Best regards,<br>The Learning Portal Team
        </p>
    </div>
</body>

</html>
